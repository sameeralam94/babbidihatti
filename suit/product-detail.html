<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suit details | BABBI DI HATTI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html#top" aria-label="BABBI DI HATTI home"><span>BABBI DI HATTI</span></a>
    <a class="header-contact" href="index.html#collection">Back to collection</a>
  </header>
  <main class="product-detail-page">
    <a class="text-link" href="index.html#collection">← Back to collection</a>
    <section class="product-detail-layout">
      <div class="product-detail-image-wrap"><img id="detail-image" class="product-detail-image" alt="" /></div>
      <div class="product-detail-copy">
        <p class="eyebrow">Suit details</p>
        <h1 id="detail-name"></h1>
        <p id="detail-description" class="product-detail"></p>
        <p id="detail-price" class="product-detail-price"></p>
        <p class="detail-intro">Made for effortless dressing, with considered proportions and fabric chosen for everyday comfort.</p>
        <a id="detail-whatsapp" class="button button-dark" target="_blank" rel="noreferrer"><i data-lucide="message-circle"></i> Ask about this suit</a>
      </div>
    </section>
  </main>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="catalog-data.js"></script>
  <script>
    const name = new URLSearchParams(window.location.search).get('product');
    const product = products.find((item) => item.name === name) || products[0];
    document.title = `${product.name} | BABBI DI HATTI`;
    document.querySelector('#detail-image').src = product.image;
    document.querySelector('#detail-image').alt = `${product.name}, ${product.detail}`;
    document.querySelector('#detail-name').textContent = product.name;
    document.querySelector('#detail-description').textContent = product.detail;
    document.querySelector('#detail-price').textContent = product.price;
    const message = `Hello babbi di hatti , I'm interested in:\n${product.name}\n${product.detail}\nPrice: ${product.price}\n\nCould you tell me more about availability and sizing?`;
    document.querySelector('#detail-whatsapp').href = `https://wa.me/917508308601?text=${encodeURIComponent(message)}`;
    lucide.createIcons();
  </script>
</body>
</html>
